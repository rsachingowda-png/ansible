---
###############################################################################
# CROSS PLATFORM DISCOVERY PLAYBOOK (ROBUST VERSION)
###############################################################################

###############################################################################
# PHASE 1 - RUNTIME INVENTORY
###############################################################################

- name: Build runtime host
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Validate hostname
      fail:
        msg: "hostname variable is required"
      when: hostname is not defined or hostname | length == 0

    - name: Add runtime host dynamically
      add_host:
        name: "{{ hostname }}"
        groups: runtime_targets
        ansible_host: "{{ hostname }}"
        ansible_user: "{{ ansible_user | default('root') }}"
        ansible_connection: ssh

###############################################################################
# PHASE 2 - DISCOVERY
###############################################################################

- name: Cross Platform System Discovery
  hosts: runtime_targets
  gather_facts: false
  ignore_unreachable: true
  any_errors_fatal: false

  tasks:

    ###########################################################################
    # SAFE FACT COLLECTION
    ###########################################################################

    - name: Gather system facts safely
      setup:
        gather_subset:
          - min
      failed_when: false
      changed_when: false

    - name: Detect OS type
      set_fact:
        os_type: >-
          {{
            'Windows' if (ansible_os_family | default('')) == 'Windows'
            else 'Linux'
          }}

    - name: Show OS info
      debug:
        msg:
          host: "{{ inventory_hostname }}"
          os: "{{ os_type | default('UNKNOWN') }}"
          family: "{{ ansible_os_family | default('UNKNOWN') }}"

    ###########################################################################
    # LINUX PROCESS DISCOVERY
    ###########################################################################

    - name: Get Linux processes
      shell: ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -20
      register: linux_processes
      failed_when: false
      changed_when: false
      when: os_type == 'Linux'

    - name: Show Linux processes
      debug:
        msg: "{{ linux_processes.stdout_lines | default([]) }}"
      when: os_type == 'Linux'

    ###########################################################################
    # WINDOWS PROCESS DISCOVERY
    ###########################################################################

    - name: Get Windows processes
      win_shell: |
        Get-Process |
        Sort-Object CPU -Descending |
        Select-Object -First 20 Name, Id, CPU
      register: windows_processes
      failed_when: false
      changed_when: false
      when: os_type == 'Windows'

    - name: Show Windows processes
      debug:
        msg: "{{ windows_processes.stdout_lines | default([]) }}"
      when: os_type == 'Windows'

    ###########################################################################
    # DOCKER DETECTION
    ###########################################################################

    - name: Check Docker (Linux)
      shell: docker --version
      register: docker_linux
      failed_when: false
      changed_when: false
      when: os_type == 'Linux'

    - name: Show Docker (Linux)
      debug:
        msg: "{{ docker_linux.stdout | default('Docker not installed') }}"
      when:
        - os_type == 'Linux'
        - docker_linux is defined
        - docker_linux.rc is defined
        - docker_linux.rc == 0

    - name: Get Docker containers (Linux)
      shell: docker ps --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Image{{'}}'}}\t{{'{{'}}.Status{{'}}'}}"
      register: docker_containers_linux
      failed_when: false
      changed_when: false
      when:
        - os_type == 'Linux'
        - docker_linux is defined
        - docker_linux.rc is defined
        - docker_linux.rc == 0

    - name: Show Docker containers (Linux)
      debug:
        msg: "{{ docker_containers_linux.stdout_lines | default([]) }}"
      when:
        - os_type == 'Linux'
        - docker_linux is defined
        - docker_linux.rc is defined
        - docker_linux.rc == 0

    ###########################################################################
    # KUBERNETES DETECTION
    ###########################################################################

    - name: Check kubectl (Linux)
      shell: kubectl version --client
      register: kubectl_linux
      failed_when: false
      changed_when: false
      when: os_type == 'Linux'

    - name: Show kubectl version
      debug:
        msg: "{{ kubectl_linux.stdout | default('kubectl not installed') }}"
      when:
        - os_type == 'Linux'
        - kubectl_linux is defined
        - kubectl_linux.rc is defined
        - kubectl_linux.rc == 0

    - name: Get Kubernetes pods (Linux)
      shell: kubectl get pods -A
      register: k8s_pods_linux
      failed_when: false
      changed_when: false
      when:
        - os_type == 'Linux'
        - kubectl_linux is defined
        - kubectl_linux.rc is defined
        - kubectl_linux.rc == 0

    - name: Show Kubernetes pods
      debug:
        msg: "{{ k8s_pods_linux.stdout_lines | default([]) }}"
      when:
        - os_type == 'Linux'
        - kubectl_linux is defined
        - kubectl_linux.rc is defined
        - kubectl_linux.rc == 0

###############################################################################
# END
###############################################################################
